version: 2

project_name: oa

before:
  hooks:
    - go mod tidy

builds:
  - id: oa
    main: ./cmd/oa
    binary: oa
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/0x46616c6b/openaleph-cli/internal/cmd.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "oa_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Release notes are drafted by release-drafter (.github/release-drafter.yml).
changelog:
  disable: true

# The release is published on GitHub first, with the notes that release-drafter
# prepared. GoReleaser cannot update a published release, so it does not touch
# it: the release workflow attaches the archives and checksums with `gh`.
release:
  disable: true

# Homebrew formula in the tap repository 0x46616c6b/homebrew-tap. Install with:
#   brew install 0x46616c6b/tap/oa
# A formula is used instead of a cask on purpose: Homebrew puts downloaded casks
# under macOS quarantine, which kills this unsigned binary, formulae are not
# quarantined. GoReleaser marks `brews` as deprecated in favor of
# `homebrew_casks`, so `goreleaser check` reports it, the release still works.
# Needs the HOMEBREW_TAP_GITHUB_TOKEN secret: a token with write access to
# the tap repository (the default GITHUB_TOKEN cannot push to other repos).
brews:
  - name: oa
    repository:
      owner: 0x46616c6b
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    # The release is disabled above, so GoReleaser cannot derive the download URL.
    url_template: "https://github.com/0x46616c6b/openaleph-cli/releases/download/{{ .Tag }}/{{ .ArtifactName }}"
    homepage: https://github.com/0x46616c6b/openaleph-cli
    description: OpenAleph on the command line, a drop-in replacement for the Python client
    license: MIT
    commit_msg_template: "chore: update {{ .ProjectName }} to {{ .Tag }}"
    test: |
      assert_match version.to_s, shell_output("#{bin}/oa --version")
    install: |
      bin.install "oa"
      generate_completions_from_executable(bin/"oa", "completion")
