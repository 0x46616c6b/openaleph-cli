version: 2

project_name: oa

before:
  hooks:
    - go mod tidy

builds:
  - id: oa
    main: ./cmd/oa
    binary: oa
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/0x46616c6b/openaleph-cli/internal/cmd.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "oa_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

# Release notes are drafted by release-drafter (.github/release-drafter.yml).
changelog:
  disable: true

# Attach the artifacts to the draft that release-drafter prepared for this tag
# and keep its notes.
release:
  use_existing_draft: true
  mode: keep-existing
