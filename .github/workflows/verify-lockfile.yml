name: Verify lockfile

# Fails when .github/workflows/actions.lock no longer matches the workflows,
# or when a locked pin cannot be verified upstream.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.0

      - name: Verify lockfile
        run: gh actions-lock --verify
